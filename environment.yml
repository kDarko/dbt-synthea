    - dbt-core==1.8.7
    - dbt-duckdb==1.8.0
    - dbt-postgres==1.8.0
    - dbt-adapters==1.7.0
    - dbt-common==1.10.0
    - dbt-extractor==0.5.1
    - dbt-semantic-interfaces==0.5.1
    # Database engines
