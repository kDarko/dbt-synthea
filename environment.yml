    - daff==1.3.46
    - networkx==3.3
    - deepdiff==7.0.1
    - mashumaro==3.13.1
    - more-itertools==10.5.0
    - ordered-set==4.1.0
    # Development tools
    - pre-commit==3.8.0
    - sqlfluff==3.2.0
